name: Verify SATU
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm install
      - name: Build SATU and TEMAN web
        run: npm run build
      - name: Install Family Link API dependencies
        working-directory: api
        run: npm install
      - name: Build Family Link API
        working-directory: api
        run: npm run build
