name: Deploy SATU to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build SATU
        run: npm run build

      - name: Stage approved SATU production assets
        run: |
          cp src/file_00000000f2048211af2c42d6916908f4.png dist/satu-logo.png
          cp src/file_000000008fc48207805b894adae81d86.png dist/satu-social.png
          test -s dist/satu-logo.png
          test -s dist/satu-social.png

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: dist
          api_location: api
          skip_app_build: true

      - name: Verify branded production domain
        run: |
          sleep 5
          curl --fail --silent --show-error --retry 8 --retry-delay 5 https://satu.tgpu.my/ -o /tmp/satu.html
          grep -q "SATU by TGPU" /tmp/satu.html
          grep -q "https://satu.tgpu.my/" /tmp/satu.html
          curl --fail --silent --show-error --retry 5 --retry-delay 4 https://satu.tgpu.my/manifest.webmanifest -o /tmp/manifest.json
          node -e "const m=require('/tmp/manifest.json'); if(!m.name.includes('SATU') || m.start_url!=='/') process.exit(1)"
          curl --fail --silent --show-error --retry 5 --retry-delay 4 https://satu.tgpu.my/satu-logo.png -o /tmp/satu-logo.png
          test "$(wc -c < /tmp/satu-logo.png)" -gt 100000
          curl --fail --silent --show-error --retry 5 --retry-delay 4 https://satu.tgpu.my/robots.txt -o /tmp/robots.txt
          grep -q "sitemap.xml" /tmp/robots.txt
          echo "SATU verified on satu.tgpu.my"
